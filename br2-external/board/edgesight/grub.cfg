# EdgeSight GRUB configuration - RAUC A/B slot selection with boot-attempt counting
#
# Environment (EFI/BOOT/grubenv, written by RAUC via grub-editenv):
#   ORDER   slot priority, e.g. "A B"   (rauc install puts the new slot first)
#   X_OK    1 = slot is bootable         (rauc status mark-good / mark-bad)
#   X_TRY   1 = slot was tried and has not yet been confirmed good by the
#           health check -> a second attempt is NOT made, we fall back.
serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial
set timeout=0

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

set slot=""
for s in $ORDER; do
  if [ "$s" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" ]; then set slot=A; break; fi
  if [ "$s" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" ]; then set slot=B; break; fi
done

# Every slot failed its last attempt: boot any slot still marked OK (rescue)
if [ -z "$slot" ]; then
  if [ "$A_OK" = "1" ]; then set slot=A; elif [ "$B_OK" = "1" ]; then set slot=B; else set slot=A; fi
  echo "EdgeSight: no untried good slot, rescue boot of $slot"
fi

if [ "$slot" = "A" ]; then
  set A_TRY=1
  set bootpart=(hd0,gpt2)
  set rootdev=/dev/vda4
else
  set B_TRY=1
  set bootpart=(hd0,gpt3)
  set rootdev=/dev/vda5
fi
save_env A_TRY A_OK B_TRY B_OK ORDER

# verity.cfg sits next to the kernel in the slot's boot partition and was
# generated at build time from the matching rootfs image (root hash + geometry)
source $bootpart/verity.cfg

echo "EdgeSight: booting slot $slot (ORDER=$ORDER A_OK=$A_OK A_TRY=$A_TRY B_OK=$B_OK B_TRY=$B_TRY)"
linux $bootpart/bzImage console=ttyS0,115200 quiet loglevel=4 panic=5 rauc.slot=$slot root=/dev/dm-0 rootfstype=squashfs ro dm-mod.waitfor=$rootdev "dm-mod.create=vroot,,,ro,0 $verity_sectors verity 1 $rootdev $rootdev 4096 4096 $verity_blocks $verity_hash_start sha256 $verity_root $verity_salt 1 panic_on_corruption" $extra_cmdline
boot
