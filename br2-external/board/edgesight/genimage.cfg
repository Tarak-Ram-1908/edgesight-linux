# EdgeSight disk layout (GPT)
#
#  p1  ESP     vfat   GRUB (bootx64.efi), grub.cfg, grubenv          shared
#  p2  bootA   vfat   bzImage + verity.cfg for rootA                RAUC slot boot.0
#  p3  bootB   vfat   bzImage + verity.cfg for rootB                RAUC slot boot.1
#  p4  rootA   raw    squashfs + dm-verity hash tree (read-only)    RAUC slot rootfs.0
#  p5  rootB   raw    squashfs + dm-verity hash tree (read-only)    RAUC slot rootfs.1
#  p6  data    ext4   /data: state, OTA staging, /etc overlay upper
#
# Reproducibility: every GUID is fixed and FAT images are made with --invariant
# (constant volume ID and timestamps), so two builds give a bit-identical disk.img.

image esp.vfat {
	vfat {
		label = "ESP"
		extraargs = "--invariant"
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 8M
}

image boot.vfat {
	vfat {
		label = "BOOT"
		extraargs = "--invariant"
		file bzImage {
			image = "bzImage"
		}
		file verity.cfg {
			image = "verity.cfg"
		}
	}
	size = 12M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "e5e5e5e5-0000-4000-8000-000000000000"
	}

	partition esp {
		partition-type-uuid = U
		partition-uuid = "e5e5e5e5-0001-4000-8000-000000000001"
		image = "esp.vfat"
		offset = 1M
		bootable = true
	}

	partition bootA {
		partition-type-uuid = L
		partition-uuid = "e5e5e5e5-0002-4000-8000-000000000002"
		image = "boot.vfat"
	}

	partition bootB {
		partition-type-uuid = L
		partition-uuid = "e5e5e5e5-0003-4000-8000-000000000003"
		image = "boot.vfat"
	}

	partition rootA {
		partition-type-uuid = L
		partition-uuid = "e5e5e5e5-0004-4000-8000-000000000004"
		image = "rootfs.verity"
		size = 160M
	}

	partition rootB {
		partition-type-uuid = L
		partition-uuid = "e5e5e5e5-0005-4000-8000-000000000005"
		image = "rootfs.verity"
		size = 160M
	}

	partition data {
		partition-type-uuid = L
		partition-uuid = "e5e5e5e5-0006-4000-8000-000000000006"
		image = "data.ext4"
	}
}
