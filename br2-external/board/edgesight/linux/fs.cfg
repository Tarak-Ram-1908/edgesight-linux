# ---- fs.cfg: read-only verified root + writable data + EFI ----
# root: squashfs (zstd) under dm-verity, assembled by the kernel itself (dm-mod.create=, no initramfs)
# (tinyconfig switches off the whole "Miscellaneous filesystems" menu squashfs lives in)
CONFIG_MISC_FILESYSTEMS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_INIT=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y
# SIMD SHA-256 (SSSE3/AVX2/SHA-NI): dm-verity hashes every block read from the root fs
CONFIG_CRYPTO_SHA256_SSSE3=y
# RAUC "verity" bundles are squashfs images mounted through a loop device + dm-verity
CONFIG_BLK_DEV_LOOP=y
# /data (state, OTA staging, /etc upper layer)
CONFIG_EXT4_FS=y
CONFIG_OVERLAY_FS=y
# EFI system partition + A/B boot partitions (GRUB env lives here)
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_CODEPAGE=437
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
