# ---- boot.cfg: boot-time choices ----
# zstd: ~same size as xz, 3-4x faster decompression (see bench/ablation-kernel-compression)
CONFIG_KERNEL_ZSTD=y
# CONFIG_KERNEL_XZ is not set
# No initramfs: dm-verity root is created by the kernel (DM_INIT) straight from the cmdline
# CONFIG_BLK_DEV_INITRD is not set
