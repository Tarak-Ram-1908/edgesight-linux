# ---- virtio.cfg: the only "hardware" this image talks to ----
# On a physical edge box these four lines become: NVMe/eMMC, the board NIC,
# the TPM/RNG and the camera (USB UVC or MIPI CSI) - nothing else.
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_NETDEVICES=y
CONFIG_NET_CORE=y
CONFIG_VIRTIO_NET=y
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_VIRTIO=y
