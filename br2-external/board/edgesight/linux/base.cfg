# ---- base.cfg: the minimum a glibc + BusyBox userland needs on x86_64 ----
CONFIG_64BIT=y
CONFIG_LOCALVERSION="-edgesight"
CONFIG_DEFAULT_HOSTNAME="edgesight"
CONFIG_MULTIUSER=y
CONFIG_SYSVIPC=y
CONFIG_POSIX_TIMERS=y
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y
CONFIG_BUG=y
CONFIG_FUTEX=y
CONFIG_EPOLL=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EVENTFD=y
CONFIG_SHMEM=y
CONFIG_ADVISE_SYSCALLS=y
CONFIG_MEMBARRIER=y
CONFIG_RSEQ=y
CONFIG_FILE_LOCKING=y
CONFIG_FHANDLE=y
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_PROC_FS=y
CONFIG_PROC_SYSCTL=y
CONFIG_SYSFS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_INOTIFY_USER=y

# Console: serial only (no VT, no framebuffer, no input stack).
# tinyconfig leaves the legacy PC input stack on x86; its i8042/PS2-mouse probe takes ~0.43 s
# under QEMU and dm-init waits for all device probes before creating the verified root.
# (Measured: removing it moved "Run /sbin/init" from 0.755 s to 0.390 s.)
# CONFIG_VT is not set
# CONFIG_INPUT is not set
# CONFIG_SERIO is not set
CONFIG_TTY=y
CONFIG_UNIX98_PTYS=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_EARLY_PRINTK=y

# Block layer + GPT
CONFIG_BLOCK=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y

# Platform: SMP x86-64 PC, ACPI (needed for CPU enumeration under OVMF), UEFI boot
CONFIG_SMP=y
CONFIG_NR_CPUS=8
CONFIG_CPU_SUP_INTEL=y
CONFIG_CPU_SUP_AMD=y
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_ACPI=y
CONFIG_HPET_TIMER=y
CONFIG_HIGH_RES_TIMERS=y
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_RELOCATABLE=y

# Running as a KVM guest: paravirt clock/spinlocks cut timer + IPI overhead
CONFIG_HYPERVISOR_GUEST=y
CONFIG_PARAVIRT=y
CONFIG_KVM_GUEST=y

# Wall clock is required: RAUC verifies X.509 validity dates of update bundles
CONFIG_RTC_CLASS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_DRV_CMOS=y
