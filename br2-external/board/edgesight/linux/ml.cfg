# ---- ml.cfg: scheduling and memory settings for a CPU inference accelerator path ----
# Resource isolation of the inference service (cgroup v2: cpu.max, memory.max, pids.max, cpuset)
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_PIDS=y

# Model weights + activations: THP (madvise mode) cuts dTLB misses in the GEMM loops
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y

# Latency determinism: tickless isolated cores (isolcpus=/nohz_full= on the cmdline)
CONFIG_NO_HZ_FULL=y
CONFIG_CPU_ISOLATION=y
CONFIG_PREEMPT_VOLUNTARY=y
CONFIG_SCHED_MC=y

# Contiguous-memory reserve for a future DMA-capable NPU/VPU (size chosen at boot with cma=)
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=0
