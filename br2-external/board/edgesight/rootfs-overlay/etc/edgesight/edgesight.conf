# EdgeSight service configuration (sourced by /usr/libexec/edgesight/*).
# /etc is an overlay: edits persist on /data, the shipped defaults stay verified on the rootfs.

# ---- inference ----
RUNTIME=ort                     # ort | tflite
MODEL=/usr/share/edgesight/models/ssd_mobilenet_v1_fp32.onnx
THREADS=2                       # intra-op threads
SCORE=0.5                       # detection score threshold
ORT_SPIN=0                      # 0: idle threads sleep (-33 % CPU/frame, same FPS); 1: busy-wait

# ---- frames ----
SOURCE=dir:/usr/share/edgesight/samples   # offline loop when no camera is connected
CAMERA_PORT=5000                # MJPEG-over-TCP camera input (ffmpeg -f mjpeg tcp://<dev>:5000)
FPS=10                          # pacing for the offline loop (0 = flat out)
SAMPLE_HOLD=2                   # seconds each sample picture stays on screen (inference keeps running)

# ---- outputs ----
HTTP_PORT=8080                  # dashboard, /metrics, /healthz
MQTT_HOST=127.0.0.1
MQTT_PORT=1883
MQTT_TOPIC=edgesight

# ---- sandbox ----
SANDBOX=strict                  # strict = drop privs + no_new_privs + landlock + seccomp(kill)
CG_CPU_MAX="max 100000"         # cgroup v2 cpu.max  (quota period)
CG_MEM_MAX=512M                 # cgroup v2 memory.max
CG_PIDS_MAX=64
CG_CPUSET=                      # e.g. "1" together with isolcpus=1 nohz_full=1

# ---- updates ----
OTA_URL=http://10.0.2.2:8000    # QEMU user-net host; a real fleet would use HTTPS + hawkBit
OTA_INTERVAL=15
HEALTH_TIMEOUT=45

EXTRA_ARGS=
