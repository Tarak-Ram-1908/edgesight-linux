#!/usr/sbin/nft -f
# EdgeSight firewall: default-deny inbound, only the three service ports are reachable.
flush ruleset

table ip filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        icmp type echo-request limit rate 5/second accept
        tcp dport 8080 accept comment "dashboard, /metrics, /healthz"
        tcp dport 1883 ip saddr 10.0.2.0/24 accept comment "MQTT (site network only)"
        tcp dport 5000 ip saddr 10.0.2.0/24 accept comment "MJPEG camera ingest"
        limit rate 6/minute log prefix "edgesight-fw drop: " level warn
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
        oif "lo" accept
        ct state established,related accept
        # Egress control: the inference service may answer clients but never initiate a
        # connection off-box (no telemetry, no exfiltration even if the process is compromised)
        meta skuid "edgesight" counter log prefix "edgesight-fw egress: " level warn drop
    }
}
