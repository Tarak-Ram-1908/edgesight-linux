[system]
compatible=edgesight-x86_64
bootloader=grub
grubenv=/boot/efi/EFI/BOOT/grubenv
data-directory=/data/rauc
# root is read-only (dm-verity): bundles and slots are mounted on tmpfs
mountprefix=/run/rauc
bundle-formats=-plain
max-bundle-download-size=268435456

[keyring]
path=/etc/rauc/ca.cert.pem
check-purpose=codesign

[slot.rootfs.0]
device=/dev/vda4
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/vda5
type=raw
bootname=B

[slot.boot.0]
device=/dev/vda2
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/vda3
type=vfat
parent=rootfs.1
